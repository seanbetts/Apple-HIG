name: Weekly HIG Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npx playwright install chromium

      - run: npm run discover

      - run: npm run plan

      - name: Determine whether render work is needed
        id: plan
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('data/manifests/plan.json', 'utf8'));
          const shouldRender = plan.renderUrls.length > 0 || plan.removedUrls.length > 0;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_render=${shouldRender}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `render_count=${plan.renderUrls.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `removed_count=${plan.removedUrls.length}\n`);
          EOF

      - run: npm run render
        if: steps.plan.outputs.should_render == 'true'

      - run: npm run verify
        if: steps.plan.outputs.should_render == 'true'

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          git commit -m "docs: refresh Apple HIG mirror"
          git push
